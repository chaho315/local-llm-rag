# =====================================================================
#  MySQL 8.4.3 (zip 설치본) 설정 - 로컬 RAG PoC 전용
#  기동:  mysqld --defaults-file=C:\Users\user\Desktop\claude\llm\db\my.ini
#  ※ 이 PC(16GB RAM)에서 Ollama(모델 2.5GB)와 동시 구동 시 OOM 방지를 위해
#    메모리 사용을 보수적으로 설정했습니다.
# =====================================================================

[mysqld]
# --- 경로 (zip 설치본) ---
basedir  = C:/Users/user/Desktop/claude/llm/db/mysql-8.4.3-winx64
datadir  = C:/Users/user/Desktop/claude/llm/db/data
port     = 3306

# --- 로컬(폐쇄망) 전용: 외부 네트워크 노출 차단 ---
bind-address = 127.0.0.1

# --- 파일명 고정 (호스트명이 바뀌어도 동일하게) ---
pid-file  = mysql.pid
log-error = mysql-error.log

# --- 문자셋: 한글 안전 (utf8mb4) ---
character-set-server = utf8mb4
collation-server     = utf8mb4_0900_ai_ci

# --- 메모리 절약 (OOM 재발 방지) ---
performance_schema        = OFF     # 성능 스키마 끄면 수백 MB 절약
innodb_buffer_pool_size   = 128M    # InnoDB 캐시 (기본값, PoC엔 충분)
innodb_flush_log_at_trx_commit = 2  # 커밋시 디스크 부하 완화
max_connections           = 50
table_open_cache          = 200
table_definition_cache    = 200
tmp_table_size            = 16M
max_heap_table_size       = 16M

[client]
port                 = 3306
default-character-set = utf8mb4
